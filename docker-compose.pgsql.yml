# Run the same Campuly image on PostgreSQL instead of MySQL:
#   docker compose -f docker-compose.prod.yml -f docker-compose.pgsql.yml up -d --build
services:
  app:
    environment:
      DB_CONNECTION: pgsql
      DB_PORT: "5432"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-campuly}
      POSTGRES_USER: ${DB_USERNAME:-campuly}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - campuly-pgsql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-campuly} -d ${DB_DATABASE:-campuly}"]
      interval: 5s
      retries: 30

volumes:
  campuly-pgsql:
