name: Campuly CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI (${{ matrix.db }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # PostgreSQL and SQLite stop part-way through the migrations until STEP 0.4.
    continue-on-error: ${{ matrix.db != 'mysql' }}
    strategy:
      fail-fast: false
      matrix:
        db: [mysql, pgsql, sqlite]
    services:
      mysql:
        image: ${{ matrix.db == 'mysql' && 'mysql:8.0' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testing
          MYSQL_USER: sail
          MYSQL_PASSWORD: password
        ports:
          - '3306:3306'
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: ${{ matrix.db == 'pgsql' && 'postgres:16' || '' }}
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: sail
          POSTGRES_PASSWORD: password
        ports:
          - '5432:5432'
        options: >-
          --health-cmd="pg_isready -U sail -d testing"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out the application
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, dom, gd, intl, mbstring, pdo_mysql, pdo_pgsql, pdo_sqlite, sqlite3, redis, xml, zip
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install PHP dependencies
        run: composer install --no-ansi --no-interaction --no-progress --prefer-dist

      # phpunit.xml forces Sail's MySQL settings (host mysql, user sail).
      # tests/phpunit-for-driver.php writes phpunit.<db>.xml from
      # .env.testing / .env.testing.pgsql / .env.testing.sqlite.
      - name: Configure the database
        run: |
          if [ "${{ matrix.db }}" = mysql ]; then
            echo '127.0.0.1 mysql' | sudo tee -a /etc/hosts
            cp .env.testing .env
          else
            cp ".env.testing.${{ matrix.db }}" .env
          fi
          php tests/phpunit-for-driver.php ${{ matrix.db }}
          php artisan key:generate --no-interaction
          grep -E 'name="DB_(CONNECTION|HOST|PORT|DATABASE)"' "phpunit.${{ matrix.db }}.xml"

      - name: Build front-end assets
        run: |
          npm ci
          npm run build

      - name: Migrate
        run: php artisan migrate --force --no-interaction

      # An S3-compatible server for tests/Feature/S3CompatibleStorageTest.php.
      - name: Start MinIO
        if: matrix.db == 'mysql'
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=campuly -e MINIO_ROOT_PASSWORD=campuly-secret \
            minio/minio server /data
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:9000/minio/health/live && break; sleep 1; done

      - name: Run tests
        env:
          S3_TEST_ENDPOINT: ${{ matrix.db == 'mysql' && 'http://127.0.0.1:9000' || '' }}
          S3_TEST_KEY: campuly
          S3_TEST_SECRET: campuly-secret
        run: php vendor/bin/pest --configuration=phpunit.${{ matrix.db }}.xml --compact

      - name: Check code style
        if: matrix.db == 'mysql'
        run: vendor/bin/pint --test

      - name: Run static analysis
        if: matrix.db == 'mysql'
        run: vendor/bin/phpstan analyse --memory-limit=2G --no-progress

  container:
    name: Container (MySQL, then PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out the application
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Write a production .env
        run: |
          cp .env.example .env
          {
            echo "APP_ENV=production"
            echo "APP_DEBUG=false"
            echo "APP_URL=http://localhost:8080"
            echo "APP_KEY=base64:$(openssl rand -base64 32)"
            echo "DB_DATABASE=campuly"
            echo "DB_USERNAME=campuly"
            echo "DB_PASSWORD=$(openssl rand -hex 16)"
            echo "DB_ROOT_PASSWORD=$(openssl rand -hex 16)"
            echo "MAIL_MAILER=log"
          } >> .env

      - name: Build the image
        run: docker compose -f docker-compose.prod.yml build

      - name: Start on MySQL and wait for a healthy app
        run: |
          docker compose -f docker-compose.prod.yml up -d
          .github/scripts/wait-for-health.sh
          curl -sf -o /dev/null -w "/login %{http_code}\n" http://localhost:8080/login

      - name: Logs (MySQL)
        if: always()
        run: docker compose -f docker-compose.prod.yml logs --tail=200 app

      - name: Start the same image on PostgreSQL
        run: |
          docker compose -f docker-compose.prod.yml down -v
          docker compose -f docker-compose.prod.yml -f docker-compose.pgsql.yml up -d
          .github/scripts/wait-for-health.sh
          curl -sf -o /dev/null -w "/login %{http_code}\n" http://localhost:8080/login

      - name: Logs (PostgreSQL)
        if: always()
        run: docker compose -f docker-compose.prod.yml -f docker-compose.pgsql.yml logs --tail=200 app
