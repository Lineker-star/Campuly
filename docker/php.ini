memory_limit = 512M
upload_max_filesize = 50M
post_max_size = 50M
max_execution_time = 120
expose_php = Off
date.timezone = UTC

opcache.enable = 1
opcache.memory_consumption = 192
opcache.max_accelerated_files = 30000
opcache.validate_timestamps = ${PHP_OPCACHE_VALIDATE_TIMESTAMPS}
opcache.jit = tracing
opcache.jit_buffer_size = 64M
