; Campuly PHP-FPM pool settings, loaded after the image's www.conf.
[www]
; The container is configured by environment variables only (APP_KEY, DB_*,
; ...). PHP-FPM drops them from its workers unless told to keep them.
clear_env = no

pm = dynamic
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

catch_workers_output = yes
decorate_workers_output = no
